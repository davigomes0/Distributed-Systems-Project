<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Sistemas Distribuídos</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Socket.IO Client CDN -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistemas Distribuídos: Monitor em Tempo Real</h1>
            <p>Demonstração de WebSockets e Comunicação Bidirecional</p>
        </header>

        <main>
            <div class="stats-cards">
                <div class="card">
                    <h3>Utilizadores Online</h3>
                    <div id="online-count" class="big-number">0</div>
                </div>
                <div class="card">
                    <h3>Estado da Conexão</h3>
                    <div id="connection-status" class="status-indicator">A conectar...</div>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="realtimeChart"></canvas>
            </div>

            <div class="log-container">
                <h3>Histórico de Eventos</h3>
                <ul id="event-log">
                    <!-- Eventos serão inseridos aqui -->
                </ul>
            </div>
        </main>

        <footer>
            <p>Projeto Didático para Disciplina de Sistemas Distribuídos</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
